[project]
name = "whinch-simulator"
version = "0.1.0"
description = "Glider winch-launch simulator (3-DOF glider, lumped-mass rope, winch) with JAX + diffrax"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "diffrax>=0.7.2",
    "jax>=0.11.2",
    "matplotlib>=3.11.2",
    "pyside6>=6.11.2",
]

[project.scripts]
winch-gui = "winch_sim.gui.app:main"

[dependency-groups]
dev = [
    "pyrefly>=1.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "winch_sim"
module-root = ""
